# G5: push·PR 마다 린트·타입 검사·테스트(성질 기반·운영 루프 시뮬레이션 포함)
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # I2: 오박사님 PC 가 Windows 일 수 있어 두 OS 모두에서 검사(경로·인코딩·시간대)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: pip install -e ".[dev]"
      - name: 린트 (ruff)
        run: ruff check harness scripts tests
      - name: 타입 검사 (pyright)
        run: pyright
      - name: 테스트 + 커버리지 (85% 미만이면 실패)
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: ${{ matrix.os == 'windows-latest' && 'cp949' || 'utf-8' }}   # Windows 는 cp949 출력으로 검사
        run: pytest -q --cov=harness --cov-report=term-missing --cov-fail-under=85
