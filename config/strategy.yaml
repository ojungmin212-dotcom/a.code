# 의사결정 계층 설정. 임계값은 모의투자 결과로 조정한다(현재 값은 근거 없는 초기값).
version: signal_v1
min_bars: 20                 # 이만큼 1분봉이 쌓이기 전에는 판단하지 않음
stop_atr_mult: 2.0           # 손절 = 진입가 - ATR14 x 2
reward_risk: 2.5             # 익절 = 진입가 + (진입가 - 손절) x 2.5
jev:
  model: jev-1.13.0          # 별칭(jev-latest) 대신 버전 고정 — 임계값을 이 버전에 맞춤
  timeout_sec: 3.0
  min_thesis_alignment: 0.60 # noul 확률
  min_momentum_score: 2.5    # score 0~4
  max_volatile_prob: 0.30    # choice 'volatile' 확률
baseline:
  min_volume_ratio: 1.2
  confidence: 0.70           # 리스크 게이트 통과용 고정값
# 섀도 판단(F4): 주문과 무관하게 매 1분봉 Jev 판단을 기록 → 보정 표본 확대. Grok 비용 없음.
# 비용 추정: 호출당 입력 약 1,500토큰 x $0.042/백만 ≈ 0.09원. 하루 1,200회 ≈ 110원, 월 약 2,400원.
shadow:
  enabled: true
  extra_symbols: {KR: ["000660", "035420"]}   # 섀도 전용(매매 안 함): SK하이닉스, NAVER
  max_calls_per_day: 1200
  monthly_budget_krw: 3000
  usd_krw: 1400
  usd_per_m_input_tokens: 0.042
# 비교군(브로커 미사용, 메모리 모의 체결)에 적용할 불리한 체결 가정(bp). Jev 실측 슬리피지로 교체할 것.
paper_slippage_bps: 10
