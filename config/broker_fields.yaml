# 나무 PLUG 응답 필드명 — NH 공식 openapi 명세(PLUG-OpenAPI/nhplug-mcp specs/, 2026-10 확인) 기준 기본값.
# verified_by_mock: 모의투자 실측으로 확인했으면 true. 모의 운영은 false 여도 되지만,
#                   승격 심사·실거래는 true 여야 시작된다(scripts/check_all.py 가 자동 판정).
verified_by_mock: false

order_no_fields: [mkt_orr_no, orr_no]   # 국내 Output_0.mkt_orr_no · 미국 Output_0.orr_no
holdings_list: Output_1
symbol_field: iem_cd
quantity_field: itg_bnc_qty    # 통합잔고수량. 후보: rsdl_qty(잔량수량) — 실측으로 확정
avg_price_field: phs_pr        # 매입가격

# 미국(P4 — 현재 보류, D1)
us:
  sell_path: /gbstock/order/v1/sell
  holdings_list: Output_1
  symbol_field: iem_cd
  quantity_field: cns_bse_bnc_qty   # 체결기준잔고수량
  avg_price_field: fc_avg_phs_pr    # 외화평균매입가격(USD)
  fx_field: tdt_sby_bse_xcg_rt      # 당일매매기준환율 (F8 후보)
